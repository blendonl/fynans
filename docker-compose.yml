services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "ollama pull ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b} && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}",
      ]
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: "no"

  donut:
    build:
      context: ./apps/backend/docker/donut-service
      dockerfile: Dockerfile
    profiles: [donut]
    volumes:
      - donut-models:/root/.cache/huggingface
    ports:
      - "${DONUT_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 180s
    shm_size: 2G
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      PADDLEOCR_SERVICE_URL: ${PADDLEOCR_SERVICE_URL:-http://paddleocr:8000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_SERVICE_URL: ${OLLAMA_SERVICE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      VISION_PARSER: ${VISION_PARSER:-}
      DONUT_SERVICE_URL: ${DONUT_SERVICE_URL:-http://donut:8001}
      DONUT_TIMEOUT: ${DONUT_TIMEOUT:-120000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"

  paddleocr:
    build:
      context: ./apps/backend/docker/paddleocr-service
      dockerfile: Dockerfile
    profiles: [paddle]
    ports:
      - "${PADDLEOCR_PORT:-8000}:8000"
    volumes:
      - paddleocr-models:/root/.paddleocr
      - paddlex-models:/root/.paddlex
    environment:
      - USE_GPU=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 180s
    shm_size: 2G
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  paddleocr-models:
  paddlex-models:
  redis-data:
  ollama-models:
  donut-models:

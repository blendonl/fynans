services:
  postgres:
    image: 'postgres:${POSTGRES_VERSION:-16-alpine}'
    ports:
      - '${POSTGRES_PORT:-5437}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-admin}'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}

  # postgres-test:
  #   image: "postgres:${POSTGRES_VERSION:-16-alpine}"
  #   tmpfs:
  #     - /pgtmpfs
  #   ports:
  #     - "${POSTGRES_TEST_PORT:-5433}:5432"
  #   environment:
  #     POSTGRES_USER: "${POSTGRES_USER:-admin}"
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
  #     PGDATA: /pgtmpfs

  # api:
  #   build:
  #     context: ../..
  #     dockerfile: apps/backend/Dockerfile
  #   ports:
  #     - '3007:3000'
  #   depends_on:
  #     - postgres
  #     - paddleocr
  #   environment:
  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/db
  #     - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your-secret-key-minimum-32-characters-long-change-this-in-production}
  #     - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
  #     - PORT=3000
  #   restart: unless-stopped

  paddleocr:
    build:
      context: ./docker/paddleocr-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - paddleocr-models:/root/.paddleocr
      - paddlex-models:/root/.paddlex
    environment:
      - USE_GPU=true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 180s
    shm_size: 2G
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'ollama pull ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b} && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}',
      ]
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: 'no'

  donut:
    build:
      context: ./docker/donut-service
      dockerfile: Dockerfile
    profiles: [donut]
    volumes:
      - donut-models:/root/.cache/huggingface
    ports:
      - '8001:8001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8001/health']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 180s
    shm_size: 2G
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin}
        mc mb --ignore-existing myminio/$${MINIO_BUCKET:-fynans}
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-fynans}
    restart: 'no'

volumes:
  postgres-data:
  paddleocr-models:
  paddlex-models:
  redis-data:
  ollama-models:
  donut-models:
  minio-data:

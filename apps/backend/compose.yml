  #     - /pgtmpfs
  #   ports:
  #     - "${POSTGRES_TEST_PORT:-5433}:5432"
  #   environment:
  #     POSTGRES_USER: "${POSTGRES_USER:-admin}"
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
  #     PGDATA: /pgtmpfs

  # api:
  #   build:
  #     context: ../..
  #     dockerfile: apps/backend/Dockerfile
  #   ports:
  #     - '3007:3000'
  #   depends_on:
  #     - postgres
  #     - paddleocr
  #   environment:
  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/db
  #     - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your-secret-key-minimum-32-characters-long-change-this-in-production}
  #     - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
  #     - PORT=3000
  #   restart: unless-stopped

  paddleocr:
    build:
      context: ./docker/paddleocr-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - paddleocr-models:/root/.paddleocr
    environment:
      - LANGUAGES=sq,en
      - USE_GPU=false
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    shm_size: 2G
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'ollama pull ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b} && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}',
      ]
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: 'no'

volumes:
  postgres-data:
  paddleocr-models:
  redis-data:
  ollama-models:
